<logo-btn></logo-btn>

<nav>
	<button class="menu-btn" (click)="toggleMenu()">
		<i class="ti ti-menu-2"></i>
	</button>

	<div class="nav-options" [ngClass]="isMenuOpen ? 'visible' : 'hidden'">
		@for (option of navOptions; track option.path) {
			<a [routerLink]="option.path" [routerLinkActive]="'active'" class="nav-option">
				<div class="nav-option-icon">
					<i class="ti" [ngClass]="option.icon"></i>
				</div>

				<div class="nav-option-label">
					{{ option.label }}
				</div>
			</a>
		}

		<button class="theme-toggle-btn" (click)="themeService.toggle()">
			<i class="ti" [ngClass]="themeService.isDarkTheme ? 'ti-sun' : 'ti-moon'"></i>
		</button>
	</div>
</nav>
